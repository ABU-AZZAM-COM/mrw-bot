<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <meta name="description" content="محادثة خاصة بينك وبين إدارة منظومة استقبال البلاغات">
  <title>التواصل مع الإدارة | منظومة استقبال البلاغات</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <!--
  THESIS: A single private thread between the Telegram user and administration; this screen refuses report forms, settings, and service navigation.
  OWN-WORLD: WhatsApp conversation grammar—forest-green contact bar, pale chat-paper canvas, white administration bubbles, green user bubbles, and a compact rounded composer.
  STORY: Recognize the administration thread, scan persisted messages, then send text or an approved attachment.
  FIRST VIEWPORT: Full-height, phone-width chat with contact status above a scrollable transcript and a composer anchored at the bottom.
  FORM: User-pinned WhatsApp-inspired direct chat; the thread is the entire surface, with no concept-seed staging.
  -->
  <main class="chat-app" aria-label="محادثة التواصل مع الإدارة">
    <header class="chat-header">
      <button id="close-chat" class="icon-button close-button" type="button" aria-label="إغلاق المحادثة والعودة إلى Telegram" title="العودة إلى Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <img class="service-avatar" src="/icon.svg" alt="" aria-hidden="true">
      <div class="contact-heading">
        <h1>التواصل مع الإدارة</h1>
        <p>منظومة استقبال البلاغات</p>
      </div>
      <span id="contact-state" class="contact-state checking" role="status" aria-live="polite">
        <span class="state-dot" aria-hidden="true"></span>
        <span id="contact-state-label">جارٍ التحقق</span>
      </span>
    </header>

    <section class="conversation" aria-label="الرسائل">
      <div class="conversation-notice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3m-12 0h14v11H5z"/><path d="M12 14v3"/></svg>
        <p>هذه محادثة خاصة محفوظة بينك وبين الإدارة.</p>
      </div>
      <div id="chat-feed" class="chat-feed" role="log" aria-live="polite" aria-relevant="additions text" aria-label="سجل الرسائل">
        <div id="chat-loading" class="conversation-state">
          <span class="loading-mark" aria-hidden="true"></span>
          <p>جارٍ تحميل المحادثة...</p>
        </div>
      </div>
      <button id="latest-button" class="latest-button" type="button" hidden>
        <span aria-hidden="true">↓</span>
        رسائل جديدة
      </button>
    </section>

    <section class="composer-area" aria-label="إرسال رسالة">
      <p id="contact-notice" class="contact-notice" role="status" aria-live="polite" hidden></p>
      <div id="attachment-preview" class="attachment-preview" hidden>
        <span class="attachment-symbol" aria-hidden="true">📎</span>
        <span id="attachment-name" class="attachment-name"></span>
        <span id="attachment-size" class="attachment-size"></span>
        <button id="remove-attachment" class="remove-attachment" type="button" aria-label="إزالة المرفق" title="إزالة المرفق">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
      <form id="chat-form" class="composer">
        <label id="attach-button" class="composer-icon attach-control" for="chat-file" aria-label="إرفاق صورة أو ملف" title="إرفاق صورة أو ملف">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
        </label>
        <input id="chat-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,.docx,.xlsx,.pptx" hidden>
        <label class="sr-only" for="chat-text">اكتب رسالتك</label>
        <textarea id="chat-text" rows="1" maxlength="2000" placeholder="اكتب رسالة..." autocomplete="off"></textarea>
        <button id="chat-send" class="send-button" type="submit" aria-label="إرسال الرسالة" title="إرسال الرسالة" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
      <p id="chat-status" class="chat-status" role="status" aria-live="polite" hidden></p>
      <p class="composer-hint">صور وPDF ومستندات Office، حتى 20 ميغابايت لكل مرفق.</p>
    </section>
  </main>
</body>
</html>
