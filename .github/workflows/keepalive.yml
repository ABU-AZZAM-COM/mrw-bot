# ============================================================
#  watchdog.yml — مراقب خارجي يبقي البوت يعمل على Hugging Face
# ============================================================
#  لماذا هذا الملف؟
#  مساحة Hugging Face المجانية تتوقف بعد خمول طويل، والنبضة الداخلية لا
#  تنفع إذا أُوقفت الحاوية. لذلك يعمل هذا المراقب كل 10 دقائق من GitHub
#  Actions (مجاني: دقائق بلا حد للمستودع العام، و~1440 دقيقة شهريًا للخاص)
#  ويقوم بـ:
#      1) فحص حالة المساحة عبر واجهة Hugging Face الرسمية
#      2) إعادة تشغيلها تلقائيًا إن كانت نائمة
#      3) طلب رابطها (مع المصادقة) حتى تبقى نشطة، وإرسال تنبيه إن تعطّلت
#
#  المتطلبات (Secrets في المستودع):
#    HF_TOKEN    = رمز وصول Write من https://huggingface.co/settings/tokens
#    HF_SPACE    = azzam1992/mrw-bot
#    SERVICE_URL = https://azzam1992-mrw-bot.hf.space
#    BOT_TOKEN   = توكن البوت (اختياري — لإرسال التنبيه)
#    ADMIN_IDS    = معرّف المشرف (اختياري)
# ============================================================
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    name: مراقبة البوت على Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المتطلبات
        run: pip install huggingface_hub httpx

      - name: فحص المساحة وأبقاؤها نشطة
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
          SERVICE_URL: ${{ secrets.SERVICE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: python deploy/keepalive_watchdog.py
