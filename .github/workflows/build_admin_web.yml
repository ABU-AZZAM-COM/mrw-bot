name: build-admin-web

on:
  push:
    branches: [main]
    paths:
      - "admin_web/lib/**"
      - "admin_web/assets/**"
      - "admin_web/fonts/**"
      - "admin_web/web/**"
      - "admin_web/pubspec.yaml"
      - "admin_web/pubspec.lock"
      - "admin_web/build_release.ps1"
      - ".github/workflows/build_admin_web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-admin-web-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
          cache-key: admin-web-${{ hashFiles('admin_web/pubspec.lock') }}

      - name: Build the admin web release
        shell: pwsh
        run: ./admin_web/build_release.ps1

      - name: Publish generated web assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_web/dist admin_web/lib/version.json
          if [ -n "$(git diff --cached --name-only)" ]; then
            git commit -m "build(admin-web): publish Flutter web assets" \
              -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
            git push origin main
          fi
